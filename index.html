<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CRUD de Alunos</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="container">


        <!-- CABEÇALHO -->

        <header>

            <h1>
                Cadastro de Alunos
            </h1>

            <p>
                Sistema CRUD - Create, Read, Update e Delete
            </p>

        </header>



        <!-- FORMULÁRIO -->

        <section class="card">

            <h2 id="titulo-form">
                Cadastrar aluno
            </h2>


            <form id="aluno-form">


                <!-- ID OCULTO -->

                <input
                    type="hidden"
                    id="aluno-id"
                >


                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                        required
                    >

                </div>



                <!-- IDADE -->

                <div class="campo">

                    <label for="idade">
                        Idade
                    </label>

                    <input
                        type="number"
                        id="idade"
                        min="1"
                        max="120"
                        placeholder="Digite a idade"
                        required
                    >

                </div>



                <!-- CURSO -->

                <div class="campo">

                    <label for="curso">
                        Curso
                    </label>

                    <input
                        type="text"
                        id="curso"
                        placeholder="Digite o curso"
                        required
                    >

                </div>



                <!-- BOTÕES -->

                <div class="botoes">

                    <button
                        type="submit"
                        id="btn-salvar"
                    >
                        Cadastrar
                    </button>


                    <button
                        type="button"
                        id="btn-cancelar"
                        class="cancelar hidden"
                    >
                        Cancelar
                    </button>

                </div>


            </form>

        </section>



        <!-- LISTA DE ALUNOS -->

        <section class="card">


            <div class="lista-header">

                <h2>
                    Alunos cadastrados
                </h2>


                <button
                    id="btn-atualizar"
                    class="secundario"
                >
                    Atualizar lista
                </button>

            </div>



            <!-- MENSAGENS -->

            <div id="mensagem"></div>



            <!-- TABELA -->

            <div class="tabela-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Nome
                            </th>

                            <th>
                                Idade
                            </th>

                            <th>
                                Curso
                            </th>

                            <th>
                                Ações
                            </th>

                        </tr>

                    </thead>



                    <tbody id="lista-alunos">

                    </tbody>


                </table>


            </div>


        </section>


    </main>



    <script src="script.js"></script>


</body>

</html>
